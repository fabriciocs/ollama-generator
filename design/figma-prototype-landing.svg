<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F0E7"/>
      <stop offset="1" stop-color="#EEDFCB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5B4B37" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 H 0 V 24" stroke="#D8CDBB" stroke-opacity="0.24" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)" opacity="0.4"/>
  <circle cx="1380" cy="140" r="180" fill="#315C4D" fill-opacity="0.08"/>
  <circle cx="180" cy="1060" r="170" fill="#B46A3C" fill-opacity="0.08"/>

  <g transform="translate(82 56)">
    <text x="0" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">OLLAMA GENERATOR</text>
    <text x="0" y="42" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Gerador de Especificacao Completa de Sistemas</text>
    <text x="0" y="74" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18">Atelie operacional anti-slop para transformar ideia vaga em documentos sequenciais</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="138" width="1432" height="86" rx="28" fill="#FFFDF7" stroke="#D8CDBB"/>
  </g>
  <g transform="translate(124 166)">
    <text x="0" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">Landing</text>
    <text x="96" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Geracoes</text>
    <text x="212" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Arquivos</text>
    <text x="322" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Prompts</text>
    <text x="418" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Health</text>
    <text x="508" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Debug</text>
    <text x="586" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Configuracoes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="248" width="886" height="836" rx="32" fill="#FFFDF7" stroke="#D8CDBB"/>
    <rect x="994" y="248" width="522" height="388" rx="32" fill="#FFFDF7" stroke="#D8CDBB"/>
    <rect x="994" y="658" width="522" height="426" rx="32" fill="#FFFDF7" stroke="#D8CDBB"/>
  </g>

  <g transform="translate(124 300)">
    <text x="0" y="0" fill="#B46A3C" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">BANCADA DE ENTRADA</text>
    <text x="0" y="46" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="700">Digite a ideia do sistema</text>
    <text x="0" y="80" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">O objetivo e converter ambiguidade em uma cadeia de documentos rastreaveis.</text>

    <rect x="0" y="114" width="810" height="304" rx="24" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="24" y="150" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Ideia do sistema</text>
    <text x="24" y="178" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Descreva problema, publico, contexto operacional e resultado esperado.</text>
    <rect x="24" y="206" width="762" height="158" rx="18" fill="#FFFDF7" stroke="#D8CDBB"/>
    <text x="48" y="244" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Exemplo: plataforma SaaS para criar, gerenciar e monitorar...</text>
    <text x="48" y="274" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">O texto funciona como entrada da primeira etapa da orquestracao.</text>

    <g transform="translate(0 448)">
      <rect width="226" height="56" rx="16" fill="#315C4D"/>
      <text x="113" y="34" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Gerar documentacao</text>
      <rect x="242" width="186" height="56" rx="16" fill="#FFFDF7" stroke="#D8CDBB"/>
      <text x="335" y="34" text-anchor="middle" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Atualizar status</text>
      <rect x="440" width="220" height="56" rx="16" fill="#FFFDF7" stroke="#D8CDBB"/>
      <text x="550" y="34" text-anchor="middle" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Copiar caminho da pasta</text>
      <rect x="674" width="136" height="56" rx="16" fill="#FFFDF7" stroke="#D8CDBB"/>
      <text x="742" y="34" text-anchor="middle" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Continuar</text>
    </g>

    <g transform="translate(0 538)">
      <rect width="810" height="236" rx="24" fill="#FFFDF7" stroke="#D8CDBB"/>
      <text x="24" y="40" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">ESTADO E FEEDBACK</text>
      <rect x="24" y="62" width="762" height="34" rx="17" fill="#D8CDBB"/>
      <rect x="24" y="62" width="454" height="34" rx="17" fill="#315C4D"/>
      <text x="24" y="126" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Progresso operacional</text>
      <text x="24" y="154" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">A interface mostra a ideia sendo lapidada, nao apenas processada.</text>
      <text x="24" y="188" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Quando houver erro, a recuperacao precisa aparecer de forma util e direta.</text>
    </g>
  </g>

  <g transform="translate(1034 286)">
    <text x="0" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">INFRAESTRUTURA</text>
    <text x="0" y="40" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="700">Estado da pilha</text>
    <text x="0" y="72" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">API, SQLite e Ollama em um unico painel.</text>
    <g transform="translate(0 112)">
      <rect width="100" height="40" rx="20" fill="#FFFDF7" stroke="#2F7D57"/>
      <text x="50" y="25" text-anchor="middle" fill="#2F7D57" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">API ok</text>
      <rect x="112" width="118" height="40" rx="20" fill="#FFFDF7" stroke="#2F7D57"/>
      <text x="171" y="25" text-anchor="middle" fill="#2F7D57" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">SQLite ok</text>
      <rect x="242" width="116" height="40" rx="20" fill="#FFFDF7" stroke="#2F7D57"/>
      <text x="300" y="25" text-anchor="middle" fill="#2F7D57" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">Ollama ok</text>
    </g>
    <rect x="0" y="180" width="458" height="150" rx="22" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="24" y="216" fill="#B46A3C" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">LINHA DE PRODUCAO</text>
    <text x="24" y="254" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Etapa 0 - estetica inicial</text>
    <text x="24" y="280" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Etapas subsequentes usam a saida anterior como referencia.</text>
  </g>

  <g transform="translate(1008 696)">
    <text x="0" y="0" fill="#B46A3C" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">OUTPUTS E DIAGNOSTICO</text>
    <g transform="translate(0 24)">
      <rect width="458" height="84" rx="18" fill="#FFFDF7" stroke="#D8CDBB"/>
      <text x="20" y="32" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Logs resumidos</text>
      <text x="20" y="56" fill="#6D746D" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">{"level":"info","msg":"Generation started"}</text>
    </g>
    <g transform="translate(0 122)">
      <rect width="458" height="84" rx="18" fill="#FFFDF7" stroke="#D8CDBB"/>
      <text x="20" y="32" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Arquivos gerados</text>
      <text x="20" y="56" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">_generation-status.json, _contexto-resumido.md, _logs.md</text>
    </g>
    <g transform="translate(0 220)">
      <rect width="458" height="84" rx="18" fill="#315C4D"/>
      <text x="20" y="32" fill="#FFFFFF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Debug panel</text>
      <text x="20" y="56" fill="#F7F0E4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">Eventos locais e do backend, com foco em recuperacao.</text>
    </g>
  </g>
</svg>
