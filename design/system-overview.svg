<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F0E7"/>
      <stop offset="1" stop-color="#EFE3D1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F7F0E4"/>
    </linearGradient>
    <linearGradient id="line" x1="320" y1="450" x2="1280" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#315C4D"/>
      <stop offset="0.5" stop-color="#B46A3C"/>
      <stop offset="1" stop-color="#2F7D57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5B4B37" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 H 0 V 24" stroke="#D8CDBB" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>

  <circle cx="220" cy="140" r="110" fill="#B46A3C" fill-opacity="0.08"/>
  <circle cx="1380" cy="760" r="160" fill="#315C4D" fill-opacity="0.08"/>

  <text x="96" y="102" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Gerador de Especificacao Completa de Sistemas</text>
  <text x="96" y="138" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18">De uma ideia inicial para documentos, logs e artefatos em cadeia sequencial</text>

  <g filter="url(#shadow)">
    <rect x="90" y="190" width="360" height="510" rx="28" fill="url(#panel)" stroke="#D8CDBB" stroke-width="1.5"/>
    <rect x="510" y="190" width="580" height="510" rx="28" fill="url(#panel)" stroke="#D8CDBB" stroke-width="1.5"/>
    <rect x="1130" y="190" width="380" height="510" rx="28" fill="url(#panel)" stroke="#D8CDBB" stroke-width="1.5"/>
  </g>

  <text x="130" y="240" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">INPUT</text>
  <text x="130" y="274" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Ideia, contexto e meta</text>
  <text x="130" y="310" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">Texto curto, objetivo e exploratorio</text>

  <rect x="130" y="350" width="280" height="68" rx="16" fill="#FFFDF8" stroke="#D8CDBB"/>
  <rect x="130" y="432" width="280" height="68" rx="16" fill="#FFFDF8" stroke="#D8CDBB"/>
  <rect x="130" y="514" width="280" height="68" rx="16" fill="#FFFDF8" stroke="#D8CDBB"/>

  <text x="154" y="381" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">Problema</text>
  <text x="154" y="404" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Dor real do negocio</text>
  <text x="154" y="463" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">Publico</text>
  <text x="154" y="486" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Equipe, cliente e operacao</text>
  <text x="154" y="545" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">Resultado</text>
  <text x="154" y="568" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Especificacao estruturada</text>

  <rect x="130" y="612" width="280" height="58" rx="18" fill="#315C4D"/>
  <text x="270" y="647" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Gerar documentacao</text>

  <text x="550" y="240" fill="#B46A3C" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">PIPELINE</text>
  <text x="550" y="274" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Cadeia sequencial de etapas</text>
  <text x="550" y="310" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">Cada saida vira insumo para a proxima fase</text>

  <g transform="translate(560 360)">
    <rect x="0" y="0" width="500" height="24" rx="12" fill="#D8CDBB"/>
    <rect x="0" y="0" width="110" height="24" rx="12" fill="#315C4D"/>
    <rect x="126" y="0" width="84" height="24" rx="12" fill="#B46A3C"/>
    <rect x="226" y="0" width="96" height="24" rx="12" fill="#315C4D"/>
    <rect x="338" y="0" width="76" height="24" rx="12" fill="#B46A3C"/>
    <rect x="430" y="0" width="70" height="24" rx="12" fill="#2F7D57"/>
  </g>

  <g transform="translate(560 420)">
    <rect x="0" y="0" width="500" height="112" rx="22" fill="#FFFDF8" stroke="#D8CDBB"/>
    <circle cx="34" cy="34" r="14" fill="#315C4D"/>
    <text x="62" y="30" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Etapa 0 - estetica inicial</text>
    <text x="62" y="54" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Define tom, linguagem, estrutura e direcao editorial</text>
    <circle cx="34" cy="78" r="14" fill="#B46A3C"/>
    <text x="62" y="74" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Etapas subsequentes</text>
    <text x="62" y="98" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Fluxo tecnico, operacional, visual e de entrega</text>
  </g>

  <g transform="translate(1120 240)">
    <rect x="0" y="0" width="310" height="420" rx="28" fill="#FFFDF8" stroke="#D8CDBB"/>
    <text x="28" y="42" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">OUTPUT</text>
    <rect x="28" y="72" width="254" height="58" rx="16" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="46" y="104" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">_contexto-resumido.md</text>
    <rect x="28" y="144" width="254" height="58" rx="16" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="46" y="176" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">_logs.md</text>
    <rect x="28" y="216" width="254" height="58" rx="16" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="46" y="248" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">0-estetica-inicial.md</text>
    <rect x="28" y="288" width="254" height="58" rx="16" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="46" y="320" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">artefatos de entrega</text>
    <rect x="28" y="360" width="254" height="32" rx="16" fill="#315C4D"/>
    <text x="155" y="382" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">SQLite + filesystem</text>
  </g>

  <path d="M450 450 C480 450, 490 450, 510 450" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <path d="M1090 450 C1110 450, 1118 450, 1130 450" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="510" cy="450" r="10" fill="#B46A3C"/>
  <circle cx="1090" cy="450" r="10" fill="#315C4D"/>

  <text x="96" y="808" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Direcao visual: atelie editorial, superficies quentes, verde operacional e terracota</text>
</svg>
