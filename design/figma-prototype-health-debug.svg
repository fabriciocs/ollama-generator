<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F0E7"/>
      <stop offset="1" stop-color="#EEDFCB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5B4B37" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <circle cx="1400" cy="140" r="170" fill="#315C4D" fill-opacity="0.08"/>
  <circle cx="160" cy="960" r="170" fill="#B46A3C" fill-opacity="0.08"/>
  <g transform="translate(84 56)">
    <text x="0" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">OLLAMA GENERATOR / OPERATIONAL PANELS</text>
    <text x="0" y="42" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Health checks e logs</text>
    <text x="0" y="74" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18">Painel para verificar a infraestrutura e rastrear eventos recentes.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="84" y="140" width="1432" height="86" rx="28" fill="#FFFDF7" stroke="#D8CDBB"/>
  </g>
  <g transform="translate(124 166)">
    <text x="0" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Landing</text>
    <text x="96" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Geracoes</text>
    <text x="212" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Arquivos</text>
    <text x="322" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Prompts</text>
    <text x="418" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">Health</text>
    <text x="508" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Debug</text>
    <text x="586" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Configuracoes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="248" width="690" height="752" rx="32" fill="#FFFDF7" stroke="#D8CDBB"/>
    <rect x="798" y="248" width="718" height="752" rx="32" fill="#FFFDF7" stroke="#D8CDBB"/>
  </g>

  <g transform="translate(124 300)">
    <text x="0" y="0" fill="#B46A3C" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">HEALTH STATUS</text>
    <text x="0" y="42" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Estado da infraestrutura</text>
    <text x="0" y="74" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">A leitura precisa ser imediata e sem ornamentacao.</text>

    <rect x="0" y="114" width="618" height="96" rx="24" fill="#F7F0E4" stroke="#D8CDBB"/>
    <g transform="translate(24 142)">
      <rect width="92" height="40" rx="20" fill="#FFFDF7" stroke="#2F7D57"/>
      <text x="46" y="25" text-anchor="middle" fill="#2F7D57" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">API ok</text>
      <rect x="104" width="108" height="40" rx="20" fill="#FFFDF7" stroke="#2F7D57"/>
      <text x="158" y="25" text-anchor="middle" fill="#2F7D57" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">SQLite ok</text>
      <rect x="224" width="108" height="40" rx="20" fill="#FFFDF7" stroke="#2F7D57"/>
      <text x="278" y="25" text-anchor="middle" fill="#2F7D57" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">Ollama ok</text>
    </g>

    <rect x="0" y="230" width="618" height="152" rx="24" fill="#FFFDF7" stroke="#D8CDBB"/>
    <text x="24" y="266" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">OBSERVABILIDADE</text>
    <text x="24" y="300" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Health checks em um painel unico</text>
    <text x="24" y="328" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">A interface evita teatralidade e informa disponibilidade com objetividade.</text>
  </g>

  <g transform="translate(828 300)">
    <text x="0" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">DEBUG LOGS</text>
    <text x="0" y="42" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Eventos recentes</text>
    <text x="0" y="74" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">Frontend e backend em paralelo, com densidade de texto controlada.</text>

    <rect x="0" y="114" width="654" height="70" rx="20" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="20" y="146" fill="#1F2421" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">{"level":"info","scope":"generation","message":"Generation started"}</text>
    <text x="20" y="168" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">12:03:45</text>

    <rect x="0" y="198" width="654" height="70" rx="20" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="20" y="230" fill="#1F2421" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">{"level":"warn","scope":"ollama","message":"Retrying step 3"}</text>
    <text x="20" y="252" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">12:06:02</text>

    <rect x="0" y="282" width="654" height="70" rx="20" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="20" y="314" fill="#1F2421" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">{"level":"error","scope":"files","message":"Path traversal blocked"}</text>
    <text x="20" y="336" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">12:08:18</text>

    <rect x="0" y="382" width="654" height="150" rx="24" fill="#315C4D"/>
    <text x="24" y="420" fill="#FFFFFF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Debug panel</text>
    <text x="24" y="448" fill="#F7F0E4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">A tela de diagnostico deve ser util quando algo falha, nao quando tudo esta perfeito.</text>
    <text x="24" y="476" fill="#F7F0E4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Aacao chave: limpar logs visuais e concentrar a leitura no que mudou.</text>
  </g>
</svg>
