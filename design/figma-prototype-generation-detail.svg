<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F0E7"/>
      <stop offset="1" stop-color="#EEDFCB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5B4B37" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1460" cy="120" r="190" fill="#B46A3C" fill-opacity="0.08"/>
  <circle cx="180" cy="1060" r="170" fill="#315C4D" fill-opacity="0.08"/>

  <g transform="translate(84 56)">
    <text x="0" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">OLLAMA GENERATOR / GENERACOES</text>
    <text x="0" y="42" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Linha de producao documental</text>
    <text x="0" y="74" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18">A tela enfatiza etapa atual, arquivos de saida e recuperacao de falhas.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="138" width="1432" height="86" rx="28" fill="#FFFDF7" stroke="#D8CDBB"/>
  </g>
  <g transform="translate(124 166)">
    <text x="0" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Landing</text>
    <text x="96" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">Geracoes</text>
    <text x="212" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Arquivos</text>
    <text x="322" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Prompts</text>
    <text x="418" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Health</text>
    <text x="508" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Debug</text>
    <text x="586" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Configuracoes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="248" width="1010" height="836" rx="32" fill="#FFFDF7" stroke="#D8CDBB"/>
    <rect x="1118" y="248" width="398" height="400" rx="32" fill="#FFFDF7" stroke="#D8CDBB"/>
    <rect x="1118" y="670" width="398" height="414" rx="32" fill="#FFFDF7" stroke="#D8CDBB"/>
  </g>

  <g transform="translate(124 300)">
    <text x="0" y="0" fill="#B46A3C" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">STATUS DA GERACAO</text>
    <text x="0" y="42" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Produto em processamento</text>
    <text x="0" y="72" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">A barra, a etapa atual e os badges deixam claro o ritmo da orquestracao.</text>

    <rect x="0" y="108" width="936" height="120" rx="24" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="24" y="146" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Projeto: plataforma SaaS para gerar especificacoes a partir de uma ideia</text>
    <text x="24" y="172" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Current step key: etapa-0-estetica-inicial</text>
    <text x="24" y="198" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Output dir: generated/ollama-generator</text>

    <rect x="0" y="256" width="936" height="192" rx="24" fill="#FFFDF7" stroke="#D8CDBB"/>
    <text x="24" y="294" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">PROGRESSO OPERACIONAL</text>
    <rect x="24" y="320" width="888" height="34" rx="17" fill="#D8CDBB"/>
    <rect x="24" y="320" width="548" height="34" rx="17" fill="#315C4D"/>
    <text x="24" y="390" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">58% concluido</text>
    <text x="24" y="416" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Aproxima etapa atual: especificacao funcional estruturada</text>

    <g transform="translate(0 476)">
      <rect width="936" height="392" rx="24" fill="#FFFDF7" stroke="#D8CDBB"/>
      <text x="24" y="40" fill="#B46A3C" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">LINHA DE PRODUCAO DOCUMENTAL</text>
      <g transform="translate(24 68)">
        <rect width="888" height="54" rx="16" fill="#F7F0E4" stroke="#D8CDBB"/>
        <text x="20" y="33" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">1. Ideia inicial e enquadramento</text>
        <text x="640" y="33" fill="#2F7D57" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">completed</text>
      </g>
      <g transform="translate(24 132)">
        <rect width="888" height="54" rx="16" fill="#F7F0E4" stroke="#D8CDBB"/>
        <text x="20" y="33" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">2. Pesquisa de mercado e benchmarking</text>
        <text x="640" y="33" fill="#2F7D57" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">completed</text>
      </g>
      <g transform="translate(24 196)">
        <rect width="888" height="54" rx="16" fill="#F7F0E4" stroke="#D8CDBB"/>
        <text x="20" y="33" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">3. Especificacao funcional estruturada</text>
        <text x="640" y="33" fill="#B8872D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">running</text>
      </g>
      <g transform="translate(24 260)">
        <rect width="888" height="54" rx="16" fill="#FFFDF7" stroke="#D8CDBB"/>
        <text x="20" y="33" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">4. Arquitetura tecnica e solucao</text>
        <text x="640" y="33" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">pending</text>
      </g>
    </g>
  </g>

  <g transform="translate(1148 286)">
    <text x="0" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">STATUS E ACAO</text>
    <rect x="0" y="24" width="334" height="76" rx="18" fill="#FFFDF7" stroke="#D8CDBB"/>
    <text x="18" y="54" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Etapa com erro</text>
    <text x="18" y="78" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Botao para repetir passo aparece quando necessario.</text>
    <rect x="0" y="114" width="334" height="52" rx="16" fill="#A8453D"/>
    <text x="167" y="146" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">Repetir passo</text>
    <rect x="0" y="180" width="334" height="148" rx="22" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="18" y="214" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Estados visuais</text>
    <text x="18" y="244" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">sucesso / warning / error / default</text>
    <text x="18" y="274" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Mensagens curtas e orientadas a acao.</text>
  </g>

  <g transform="translate(1148 710)">
    <text x="0" y="0" fill="#B46A3C" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">LOGS E ARQUIVOS</text>
    <rect x="0" y="24" width="334" height="76" rx="18" fill="#FFFDF7" stroke="#D8CDBB"/>
    <text x="18" y="54" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Logs resumidos</text>
    <text x="18" y="78" fill="#6D746D" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">{"step":"0","status":"running"}</text>
    <rect x="0" y="114" width="334" height="76" rx="18" fill="#FFFDF7" stroke="#D8CDBB"/>
    <text x="18" y="144" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Arquivos gerados</text>
    <text x="18" y="168" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">_contexto-resumido.md, _logs.md</text>
    <rect x="0" y="204" width="334" height="76" rx="18" fill="#315C4D"/>
    <text x="18" y="234" fill="#FFFFFF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Debug panel</text>
    <text x="18" y="258" fill="#F7F0E4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">Eventos locais e do backend</text>
  </g>
</svg>
