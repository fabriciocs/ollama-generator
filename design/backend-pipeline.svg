<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F1E8"/>
      <stop offset="1" stop-color="#F0E3D4"/>
    </linearGradient>
    <linearGradient id="flow" x1="170" y1="450" x2="1430" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#315C4D"/>
      <stop offset="0.5" stop-color="#B46A3C"/>
      <stop offset="1" stop-color="#2F7D57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5B4B37" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="160" fill="#315C4D" fill-opacity="0.07"/>
  <circle cx="170" cy="790" r="180" fill="#B46A3C" fill-opacity="0.07"/>

  <text x="94" y="98" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="700">Backend orchestration pipeline</text>
  <text x="94" y="132" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18">NestJS, TypeORM, SQLite, prompts locais e logs estruturados</text>

  <g filter="url(#shadow)">
    <rect x="80" y="190" width="1440" height="520" rx="32" fill="#FFFDF8" stroke="#D8CDBB"/>
  </g>

  <g transform="translate(120 250)">
    <rect width="220" height="300" rx="24" fill="#F8F2E8" stroke="#D8CDBB"/>
    <rect x="24" y="24" width="56" height="56" rx="16" fill="#315C4D"/>
    <text x="24" y="114" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18" font-weight="700">1. Receive request</text>
    <text x="24" y="144" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">POST /api/generations</text>
    <text x="24" y="170" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Validate idea and slug</text>
    <text x="24" y="214" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">Input</text>
    <rect x="24" y="226" width="172" height="16" rx="8" fill="#D8CDBB"/>
    <rect x="24" y="250" width="126" height="16" rx="8" fill="#D8CDBB"/>
  </g>

  <g transform="translate(370 250)">
    <rect width="220" height="300" rx="24" fill="#F8F2E8" stroke="#D8CDBB"/>
    <rect x="24" y="24" width="56" height="56" rx="16" fill="#B46A3C"/>
    <text x="24" y="114" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18" font-weight="700">2. Prepare workspace</text>
    <text x="24" y="144" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Create output dir</text>
    <text x="24" y="170" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Init _generation-status.json</text>
    <text x="24" y="214" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">State</text>
    <rect x="24" y="226" width="160" height="16" rx="8" fill="#D8CDBB"/>
    <rect x="24" y="250" width="100" height="16" rx="8" fill="#D8CDBB"/>
  </g>

  <g transform="translate(620 250)">
    <rect width="220" height="300" rx="24" fill="#F8F2E8" stroke="#D8CDBB"/>
    <rect x="24" y="24" width="56" height="56" rx="16" fill="#2F7D57"/>
    <text x="24" y="114" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18" font-weight="700">3. Run stages</text>
    <text x="24" y="144" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Sequential prompts</text>
    <text x="24" y="170" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Stage 0 is reference</text>
    <text x="24" y="214" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">Execution</text>
    <rect x="24" y="226" width="176" height="16" rx="8" fill="#D8CDBB"/>
    <rect x="24" y="250" width="140" height="16" rx="8" fill="#D8CDBB"/>
  </g>

  <g transform="translate(870 250)">
    <rect width="220" height="300" rx="24" fill="#F8F2E8" stroke="#D8CDBB"/>
    <rect x="24" y="24" width="56" height="56" rx="16" fill="#315C4D"/>
    <text x="24" y="114" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18" font-weight="700">4. Persist outputs</text>
    <text x="24" y="144" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Markdown and HTML</text>
    <text x="24" y="170" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Save to SQLite and disk</text>
    <text x="24" y="214" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">Artifacts</text>
    <rect x="24" y="226" width="182" height="16" rx="8" fill="#D8CDBB"/>
    <rect x="24" y="250" width="130" height="16" rx="8" fill="#D8CDBB"/>
  </g>

  <g transform="translate(1120 250)">
    <rect width="220" height="300" rx="24" fill="#F8F2E8" stroke="#D8CDBB"/>
    <rect x="24" y="24" width="56" height="56" rx="16" fill="#B8872D"/>
    <text x="24" y="114" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18" font-weight="700">5. Notify frontend</text>
    <text x="24" y="144" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Polling, logs and status</text>
    <text x="24" y="170" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Health and debug panels</text>
    <text x="24" y="214" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="700">Feedback</text>
    <rect x="24" y="226" width="166" height="16" rx="8" fill="#D8CDBB"/>
    <rect x="24" y="250" width="120" height="16" rx="8" fill="#D8CDBB"/>
  </g>

  <path d="M340 400 H370" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M590 400 H620" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M840 400 H870" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M1090 400 H1120" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>

  <g transform="translate(82 750)">
    <rect width="1436" height="98" rx="24" fill="#315C4D" fill-opacity="0.08" stroke="#D8CDBB"/>
    <text x="28" y="40" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">BACKEND CONTRACT</text>
    <text x="28" y="68" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">Orchestracao sequencial, rastreabilidade operacional, health checks e persistencia para cada geracao</text>
  </g>
</svg>
