<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F0E7"/>
      <stop offset="1" stop-color="#EEDFCB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5B4B37" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="170" fill="#315C4D" fill-opacity="0.08"/>
  <circle cx="160" cy="860" r="170" fill="#B46A3C" fill-opacity="0.08"/>
  <g transform="translate(84 56)">
    <text x="0" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">OLLAMA GENERATOR / CONFIGURACOES</text>
    <text x="0" y="42" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Configuracoes</text>
    <text x="0" y="74" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18">Variaveis consumidas pelo frontend, apresentadas como painel operacional.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="140" width="1432" height="86" rx="28" fill="#FFFDF7" stroke="#D8CDBB"/>
  </g>
  <g transform="translate(124 166)">
    <text x="0" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Landing</text>
    <text x="96" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Geracoes</text>
    <text x="212" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Arquivos</text>
    <text x="322" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Prompts</text>
    <text x="418" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Health</text>
    <text x="508" y="0" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Debug</text>
    <text x="586" y="0" fill="#315C4D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="700">Configuracoes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="248" width="1432" height="632" rx="32" fill="#FFFDF7" stroke="#D8CDBB"/>
  </g>
  <g transform="translate(124 300)">
    <text x="0" y="0" fill="#B46A3C" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" font-weight="700">AMBIENTE</text>
    <text x="0" y="42" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700">Variaveis do frontend</text>
    <text x="0" y="74" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">O painel mostra apenas o que a interface realmente usa para operar.</text>

    <rect x="0" y="114" width="1360" height="86" rx="20" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="24" y="148" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">VITE_API_BASE_URL</text>
    <text x="24" y="172" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">http://localhost:3000/api</text>

    <rect x="0" y="214" width="1360" height="86" rx="20" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="24" y="248" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">VITE_LOG_LEVEL</text>
    <text x="24" y="272" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">info</text>

    <rect x="0" y="314" width="1360" height="86" rx="20" fill="#F7F0E4" stroke="#D8CDBB"/>
    <text x="24" y="348" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">VITE_ENABLE_TRACE</text>
    <text x="24" y="372" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">true</text>

    <rect x="0" y="430" width="1360" height="118" rx="24" fill="#315C4D"/>
    <text x="24" y="468" fill="#FFFFFF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="700">Diretriz visual</text>
    <text x="24" y="494" fill="#F7F0E4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Configuracoes devem parecer uma ficha operacional, nao uma pagina administrativa vazia.</text>
    <text x="24" y="520" fill="#F7F0E4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">O conteudo e curto, objetivo e orientado a diagnostico.</text>
  </g>
</svg>
