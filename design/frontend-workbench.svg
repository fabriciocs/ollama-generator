  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 720 C260 620, 420 820, 700 700 C980 580, 1140 780, 1600 640 V900 H0 Z" fill="#315C4D" fill-opacity="0.07"/>
  <circle cx="1380" cy="150" r="170" fill="#B46A3C" fill-opacity="0.08"/>
  <circle cx="240" cy="180" r="120" fill="#315C4D" fill-opacity="0.08"/>

  <text x="92" y="98" fill="#1F2421" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="700">Frontend operational workbench</text>
  <text x="92" y="132" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18">Landing page, timeline, health, logs e arquivos em um painel editorial</text>

  <g filter="url(#shadow)">
    <rect x="84" y="182" width="1430" height="586" rx="34" fill="#FFFDF8" stroke="#D8CDBB"/>
  </g>

