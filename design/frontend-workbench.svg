    <text x="48" y="304" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Debug panel</text>
    <text x="48" y="330" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Eventos locais e do backend</text>

    <rect x="28" y="372" width="350" height="88" rx="18" fill="#315C4D"/>
    <text x="48" y="406" fill="#FFFFFF" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">A interface mostra a ideia sendo lapidada</text>
    <text x="48" y="432" fill="#F7F0E4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Nao apenas processada</text>
