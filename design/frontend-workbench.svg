    <text x="46" y="226" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Texto guia, dica de contexto e resultado esperado</text>
    <rect x="46" y="250" width="388" height="58" rx="14" fill="#F7F0E4" stroke="#D8CDBB"/>

