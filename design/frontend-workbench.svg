    <text x="28" y="118" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="700">Progresso operacional</text>
    <text x="28" y="146" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14">Etapa atual, percentual concluido e status</text>
