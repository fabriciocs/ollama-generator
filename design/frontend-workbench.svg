    <text x="28" y="122" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15">Digite a ideia para iniciar a linha de producao documental</text>

    <rect x="28" y="160" width="434" height="170" rx="22" fill="#FFFDF8" stroke="#D8CDBB"/>
