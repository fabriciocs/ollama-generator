    <text x="48" y="130" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Frontend e backend em paralelo</text>

    <rect x="28" y="172" width="350" height="86" rx="18" fill="#FFFDF8" stroke="#D8CDBB"/>
    <text x="48" y="204" fill="#1F2421" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Arquivos gerados</text>
    <text x="48" y="230" fill="#6D746D" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Lista numerada por etapa</text>

